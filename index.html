<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#ffa412"
    />

    <meta
      name="color-scheme"
      content="light"
    />


    <!-- =====================================================
         FAVICON / BRAND ICON
    ====================================================== -->

    <!--
      Place your VinEco favicon here:
      public/favicon.png

      Recommended:
      512 x 512px
      transparent PNG
    -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="shortcut icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />


    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      VinEco - Natural Pet Products &amp; OEM/ODM Vietnam
    </title>

    <meta
      name="description"
      content="VinEco manufactures natural pet products in Vietnam with OEM, ODM and private-label support for distributors, retailers and global pet brands."
    />

    <meta
      name="keywords"
      content="VinEco, pet products Vietnam, natural pet products, coffee wood dog chew, dog chew manufacturer, OEM pet products, ODM pet products, private label pet products, pet toy manufacturer Vietnam"
    />

    <meta
      name="author"
      content="VinEco"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://vineco.vercel.app/"
    />


    <!-- =====================================================
         OPEN GRAPH
         Facebook / Messenger / Zalo / LinkedIn
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="VinEco"
    />

    <meta
      property="og:url"
      content="https://vineco.vercel.app/"
    />

    <meta
      property="og:title"
      content="VinEco - Natural Pet Products & OEM/ODM Vietnam"
    />

    <meta
      property="og:description"
      content="Natural pet products made in Vietnam with OEM, ODM and private-label support for distributors, retailers and global pet brands."
    />

    <meta
      property="og:image"
      content="https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="VinEco natural pet products made in Vietnam"
    />

    <meta
      property="og:locale"
      content="en_US"
    />


    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="VinEco - Natural Pet Products & OEM/ODM Vietnam"
    />

    <meta
      name="twitter:description"
      content="Natural pet products made in Vietnam with OEM, ODM and private-label support for global pet brands."
    />

    <meta
      name="twitter:image"
      content="https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="VinEco natural pet products made in Vietnam"
    />


    <!-- =====================================================
         MOBILE / BROWSER
    ====================================================== -->

    <meta
      name="application-name"
      content="VinEco"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="VinEco"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />


    <!-- =====================================================
         STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VinEco",
        "url": "https://vineco.vercel.app/",
        "logo": "https://vineco.vercel.app/favicon.png",
        "description": "VinEco manufactures natural pet products in Vietnam with OEM, ODM and private-label support for global pet brands."
      }
    </script>
  </head>


  <body>
    <!-- =====================================================
         REACT ROOT
    ====================================================== -->

    <div id="root"></div>


    <!-- =====================================================
         VITE / REACT ENTRY
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
