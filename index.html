<!doctype html>

<html lang="en">
  <head>
    <!-- =====================================================
         BASIC
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#FAF8F5"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />


    <!-- =====================================================
         FAVICON / BRAND ICON
    ====================================================== -->

    <!--
      Primary favicon:
      public/images/social/vineco-favicon-polished.svg

      SVG is preferred for modern browsers because
      it stays sharp on high-DPI displays and browser tabs.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/social/vineco-favicon-polished.svg?v=9"
    />

    <!-- PNG fallback -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/social/faviconLogo.png?v=9"
    />

    <link
      rel="shortcut icon"
      type="image/png"
      href="/images/social/faviconLogo.png?v=9"
    />

    <!-- iOS / iPadOS -->
    <link
      rel="apple-touch-icon"
      href="/images/social/faviconLogo.png?v=9"
    />


    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      VinEco - Natural Pet Products &amp; OEM/ODM Vietnam
    </title>

    <meta
      name="description"
      content="VinEco manufactures natural pet products in Vietnam with OEM, ODM and private-label support for distributors, retailers and global pet brands."
    />

    <meta
      name="keywords"
      content="VinEco, natural pet products Vietnam, coffee wood dog chew, dog chew manufacturer Vietnam, pet toy manufacturer, OEM pet products, ODM pet products, private label pet products, coffee wood dog chew manufacturer"
    />

    <meta
      name="author"
      content="VinEco"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large"
    />

    <link
      rel="canonical"
      href="https://vineco.vercel.app/"
    />


    <!-- =====================================================
         OPEN GRAPH
         Facebook / Messenger / LinkedIn / Zalo
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="VinEco"
    />

    <meta
      property="og:url"
      content="https://vineco.vercel.app/"
    />

    <meta
      property="og:title"
      content="VinEco - Natural Pet Products & OEM/ODM Vietnam"
    />

    <meta
      property="og:description"
      content="Natural pet products made in Vietnam with OEM, ODM and private-label support for distributors, retailers and global pet brands."
    />

    <meta
      property="og:image"
      content="https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg"
    />

    <meta
      property="og:image:secure_url"
      content="https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="VinEco natural pet products made in Vietnam"
    />

    <meta
      property="og:locale"
      content="en_US"
    />


    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="VinEco - Natural Pet Products & OEM/ODM Vietnam"
    />

    <meta
      name="twitter:description"
      content="Natural pet products made in Vietnam with OEM, ODM and private-label support for global pet brands."
    />

    <meta
      name="twitter:image"
      content="https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="VinEco natural pet products made in Vietnam"
    />


    <!-- =====================================================
         MOBILE / BROWSER
    ====================================================== -->

    <meta
      name="application-name"
      content="VinEco"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="VinEco"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />


    <!-- =====================================================
         PERFORMANCE
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />


    <!-- =====================================================
         STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VinEco",
        "alternateName": "VinEco Pet Toys",
        "url": "https://vineco.vercel.app/",
        "logo": "https://vineco.vercel.app/images/social/vineco-logo.png",
        "image": "https://vineco.vercel.app/images/pinterest-preview/pin-06.jpg",
        "description": "VinEco manufactures natural pet products in Vietnam with OEM, ODM and private-label support for distributors, retailers and global pet brands."
      }
    </script>
  </head>


  <body>
    <!-- =====================================================
         REACT ROOT
    ====================================================== -->

    <div id="root"></div>


    <!-- =====================================================
         VITE / REACT ENTRY
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
